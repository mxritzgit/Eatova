import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Resolve the libraries that can enter the release, including plugin transitives.
// This inventories coordinates only; it neither compiles nor signs an artifact.
tasks.register('writeDependencySbom') {
    group = 'verification'
    description = 'Write the resolved Android release dependency inventory for OSV.'
    doLast {
        def components = [:]
        ['releaseRuntimeClasspath', 'coreLibraryDesugaring'].each { name ->
            def configuration = configurations.getByName(name)
            def result = configuration.incoming.resolutionResult
            if (result.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                throw new GradleException("Cannot inventory unresolved ${name} dependencies")
            }
            result.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) {
                    def encode = { value -> URLEncoder.encode(value, 'UTF-8').replace('+', '%20') }
                    def purl = "pkg:maven/${encode(id.group)}/${encode(id.module)}@${encode(id.version)}"
                    components[purl] = [
                        type: 'library', group: id.group, name: id.module,
                        version: id.version, purl: purl,
                    ]
                }
            }
        }
        if (components.isEmpty()) {
            throw new GradleException('Android dependency inventory must not be empty')
        }
        def output = layout.buildDirectory.file('reports/dependencies/android-release.cdx.json').get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            bomFormat: 'CycloneDX', specVersion: '1.5', version: 1,
            components: components.sort().values().toList(),
        ])) + '\n', 'UTF-8')
        logger.lifecycle("Inventoried ${components.size()} resolved Android release dependencies")
    }
}
