# --- E2: ML-Kit-Barcode-Modell, gebuendelt vs. nachgeladen -------------------
# mobile_scanner-7.4.0/android/build.gradle:63-69 waehlt ohne die Zeile unten
# das GEBUENDELTE com.google.mlkit:barcode-scanning:17.3.0. Das kostet gemessen
# 15,10 MB im Fat-APK (libbarhopper_v3.so je ABI 4,95/3,24/5,91 MB plus 0,88 MB
# assets/mlkit_barcode_models/*.tflite); pro arm64-Geraet sind es nach dem
# AAB-ABI-Split real 5,83 MB.
#
# Die Zeile ist vorbereitet, aber BEWUSST AUS. Einschalten erst zusammen mit
# einem UX-Fallback in lib/src/screens/barcode_scanner_sheet.dart, sonst ist der
# Scanner beim ersten Start still tot:
#  1. Das unbundled Modell laedt Google Play Services beim ersten Scan nach. Bis
#     dahin - und dauerhaft offline oder ganz ohne Play Services (Huawei,
#     degoogled) - scheitert jeder Frame in MobileScanner.kt:225-229.
#  2. Der Fehler wird dort zu MOBILE_SCANNER_BARCODE_ERROR und landet als
#     Stream-Fehler auf controller.barcodes. Das Sheet uebergibt kein
#     onDetectError, und dessen Default ist laut mobile_scanner.dart:157-160
#     eine leere Funktion -> der Fehler wird ersatzlos verschluckt.
#  3. errorBuilder (Sheet Zeile 95) haengt an controller.value.error
#     (mobile_scanner.dart:324/347). Analyse-Fehler setzen das nie, also
#     erscheint _ScannerFailedLayer nicht.
#  4. Der Fehlerzweig in MobileScanner.kt:225-229 ruft kein imageProxy.close().
#     Mit STRATEGY_KEEP_ONLY_LATEST (Zeile 425) liefert CameraX ohne close()
#     keinen weiteren Frame - der Analyzer bleibt schon nach dem ERSTEN
#     Fehlframe stehen und erholt sich auch nach fertigem Download nicht mehr.
# Ergebnis waere: Live-Vorschau plus Scanrahmen, aber nie ein Treffer und nie
# eine Meldung. Ein kaputter Scanner wiegt schwerer als 5,83 MB.
