# --- E2: ML-Kit barcode model, bundled vs. unbundled ------------------------
# Without the line below mobile_scanner bundles the model: 5.83 MB per arm64
# device after the AAB ABI split. Prepared but DELIBERATELY OFF — the unbundled
# model is fetched by Play Services on first scan, so until that download ends,
# and permanently without network or without Play Services (Huawei, degoogled
# ROMs), every frame fails in MobileScanner.kt:225-229 and only manual product
# search is left.
#
# Enable only when BOTH hold: (1) product decision that such devices lose
# barcode scanning behind a hint pointing at product search, and (2) measured on
# device that `_neuStarten()` revives the analyzer after the download — the
# error branch never calls imageProxy.close(), and STRATEGY_KEEP_ONLY_LATEST
# then starves CameraX, so only a stop()/start() cycle recovers it.
#
# The hint path already accounts for the stall: `handleDetectError` acts on
# the FIRST error and offers a restart, because a starved analyzer never
# delivers a second one.
# dev.steenbakker.mobile_scanner.useUnbundled=true
