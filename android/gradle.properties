# --- E2: ML-Kit-Barcode-Modell, gebuendelt vs. nachgeladen -------------------
# mobile_scanner-7.4.0/android/build.gradle:63-69 waehlt ohne die Zeile unten
# das GEBUENDELTE com.google.mlkit:barcode-scanning:17.3.0. Das kostet gemessen
# 15,10 MB im Fat-APK (libbarhopper_v3.so je ABI 4,95/3,24/5,91 MB plus 0,88 MB
# assets/mlkit_barcode_models/*.tflite); pro arm64-Geraet sind es nach dem
# AAB-ABI-Split real 5,83 MB.
#
# Die Zeile ist vorbereitet, aber BEWUSST AUS.
#
# NICHT MEHR GUELTIG (Stand 2026-08-08, Welle 4/6): der UX-Fallback, dessen
# Fehlen hier frueher der Hauptgrund war, EXISTIERT inzwischen. Das Sheet
# uebergibt `onDetectError` (barcode_scanner_sheet.dart:154) statt den Fehler
# ersatzlos zu verschlucken, zeigt bei anhaltenden Analysefehlern einen Hinweis
# und faehrt den Controller ueber `_neuStarten()` (Zeile 72-85) neu hoch;
# `errorBuilder` (Zeile 159, nicht mehr 95) deckt den davon getrennten
# Kamera-Fehlerfall ab.
#
# TRAGFAEHIG BLEIBT NUR das Offline-/degoogled-Argument:
#   Das unbundled Modell laedt Google Play Services beim ersten Scan nach. Bis
#   der Download durch ist - und dauerhaft ohne Netz oder ganz ohne Play
#   Services (Huawei, degoogled ROMs) - scheitert jeder Frame in
#   MobileScanner.kt:225-229. Auf solchen Geraeten gaebe es dann keinen
#   Barcode-Scan mehr, nur noch die manuelle Produktsuche als Ersatzweg.
#
# BEDINGUNG ZUM EINSCHALTEN (beide Punkte, nicht einer davon):
#  1. Die Produktentscheidung ist gefallen, dass Geraete ohne Play Services den
#     Barcode-Scan bewusst nicht bekommen - mit einem Hinweis, der auf die
#     Produktsuche verweist, statt eines live aussehenden, toten Scanners.
#     Dann sind die 5,83 MB pro Geraet den Verzicht wert.
#  2. Am Geraet nachgemessen ist, dass `_neuStarten()` den Analyzer nach
#     FERTIGEM Modell-Download real wieder hochbringt. Der Fehlerzweig in
#     MobileScanner.kt:225-229 ruft kein imageProxy.close(); mit
#     STRATEGY_KEEP_ONLY_LATEST (Zeile 425) liefert CameraX ohne close() keinen
#     weiteren Frame. Der Analyzer erholt sich also NICHT von selbst - nur der
#     stop()/start()-Zyklus aus `_neuStarten()` holt ihn zurueck, und der
#     haengt daran, dass der Nutzer den Hinweis ueberhaupt zu sehen bekommt.
#
# OFFENER WIDERSPRUCH, hier bewusst nicht geglaettet: Punkt 2 heisst, dass der
# Analyzer schon nach dem ERSTEN Fehlframe steht (ohne close() kommt kein
# weiterer). barcode_scanner_sheet.dart:48 verlangt mit `_fehlerSchwelle = 3`
# aber drei Fehler, bevor der Hinweis erscheint. Beides zusammen kann nicht
# stimmen: steht der Analyzer nach dem ersten Frame, treffen die Fehler 2 und 3
# nie ein und der Hinweis erscheint nie. Das muss geklaert (und ggf. die
# Schwelle auf 1 gezogen) sein, BEVOR die Zeile unten aktiviert wird - hier
# wird es nicht geaendert.
