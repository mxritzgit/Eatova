name: ios

# Native compile/configuration gate. Flutter 3.47.2 uses the committed
# Swift Package Manager integration; Flutter + health remain in Podfile.lock.
# The app and Podfile both target iOS 15.
#
# --- Triggers and cost -------------------------------------------------------
# macOS runners cost 10x a Linux runner, so this runs only on ios/**,
# pubspec.yaml, pubspec.lock and this file; weekly to catch drift no file shows
# (Xcode image changes, withdrawn pod versions); and manually before a release.
# lib/** is excluded — the ubuntu job catches Dart errors at a tenth of the cost.
#
# CAUTION with branch protection (G5): never make a paths-filtered workflow a
# required status check — a PR not touching ios/ would block forever.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'
  schedule:
    # Mondays 07:00 UTC, an hour after the security workflow so the two weekly
    # runs do not collide.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Same as security.yml: minimal default, no job-local escalation needed.
permissions:
  contents: read

# Cost brake: a superseded macOS run is cancelled instead of paid for. Not on
# main, where every state's result matters.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-ios:
    name: iOS Build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      # Diagnose first: the Xcode version on macos-latest drifts, and a newer
      # Xcode may introduce new native build requirements.
      - name: Toolchain-Diagnose
        run: |
          sw_vers
          xcodebuild -version
          pod --version
          flutter --version

      # Order is binding: `pod install` reads ios/Flutter/Generated.xcconfig
      # (FLUTTER_ROOT) and .flutter-plugins-dependencies, which only
      # `flutter pub get` creates.
      - name: pub get
        run: flutter pub get

      # Fetches the iOS engine artefacts podhelper needs for the Flutter pod;
      # without them a manual `pod install` can fail on a cold runner.
      - name: precache iOS-Artefakte
        run: flutter precache --ios

      # Own step so a pod resolution conflict shows up as its own red step
      # instead of buried in 2000 lines of xcodebuild output.
      - name: pod install
        working-directory: ios
        run: pod install --repo-update

      # Report CocoaPods lock drift separately from the native compile gate.
      # The checked-in lock comes from the working SPM/CocoaPods setup; plugin
      # or CocoaPods changes may still require an updated lock.
      - name: Podfile.lock-Drift melden
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- ios/Podfile.lock; then
            echo "ios/Podfile.lock ist unveraendert — der Lock im Repo entspricht dem, was pod install aufloest."
            echo "### Podfile.lock: unveraendert" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning file=ios/Podfile.lock::pod install hat ios/Podfile.lock veraendert — der eingecheckte Lock ist nicht der aufgeloeste Stand. Diff steht in der Job-Summary."
          {
            echo "### Podfile.lock: DRIFT (Warnung, kein Fehlschlag)"
            echo ""
            echo "\`pod install\` hat den eingecheckten Lock veraendert. Den Diff unten uebernehmen"
            echo "und \`ios/Podfile.lock\` committen."
            echo ""
            echo '```diff'
            git diff -- ios/Podfile.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The regenerated lock as an artefact, so it can be committed without a
      # Mac: download it from a green run and the warning above goes away.
      - name: Podfile.lock als Artefakt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podfile-lock
          path: ios/Podfile.lock
          if-no-files-found: error

      # The actual gate: find compile and configuration errors, not build a
      # signed IPA — CI holds no Apple certificate. Defines are the same CI
      # dummies as in security.yml; dart_defines.json is gitignored.
      - name: build ios (--no-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          if [ -d "$APP" ]; then
            echo "### iOS-Build: OK" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$APP\` erzeugt ($(du -sh "$APP" | cut -f1), unsigniert)." >> "$GITHUB_STEP_SUMMARY"
            # PrivacyInfo.xcprivacy must land in the built bundle, not just in
            # pbxproj — Apple rejects the upload otherwise. Warning only.
            if [ -f "$APP/PrivacyInfo.xcprivacy" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "PrivacyInfo.xcprivacy liegt im Bundle." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::PrivacyInfo.xcprivacy fehlt im gebauten Runner.app — als Resource im Runner-Target eingetragen?"
            fi
          else
            {
              echo "### iOS-Build: FEHLGESCHLAGEN"
              echo ""
              echo "Der native Build hat keine Runner.app erzeugt. Die fehlgeschlagenen Schritte"
              echo "oben zeigen den aktuellen Fehler; Toolchain, Plugin-Aufloesung und"
              echo "Runner-Konfiguration gegen den dokumentierten Stand pruefen."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
