name: Deploy Edge Functions

# Approved deploys of supabase/functions from protected main, replacing the
# manual deploys from a Windows checkout (CRLF uploads, an unrecorded
# redeploy; docs/OPERATIONS.md, "Edge Function deploys"). Each run deploys the
# chosen functions from one commit on main, downloads the live source and
# compares it with that commit, runs the boot probe and keeps a deploy record.
# An older commit on main is a rollback. Migrations are not deployed here: the
# run refuses a commit whose migrations are not all registered live, and a
# rollback below a function's lowest safe commit without the override.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function slugs, comma-separated (e.g. coach-chat,search-key), or "all"'
        required: true
        default: all
        type: string
      sha:
        description: 'Full 40-character commit on main to deploy; empty means the current main head'
        required: false
        default: ''
        type: string
      allow_below_floor:
        description: 'Deploy a commit older than a function''s lowest safe rollback commit (ROLLBACK_FLOORS in deploy_functions.py); only after checking compatibility'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One deploy at a time; a queued run waits and a running deploy is never cancelled.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  # The version every recorded manual deploy used (docs/PROJECT_HANDOFF.md).
  SUPABASE_CLI_VERSION: 2.120.0
  # SHA-256 of supabase_linux_amd64.tar.gz of that release, as listed in its
  # checksums.txt and GitHub's asset digest (checked 2026-10-18).
  SUPABASE_CLI_SHA256: 7074584113aa00495beeac661c41fb09f1ddd0a483cd7333894b0d080086dc6e

jobs:
  deploy:
    name: Deploy, verify and record
    # Forks and other refs never reach the protected environment.
    if: github.repository == 'mxritzgit/Eatova' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-deploy
    timeout-minutes: 30
    steps:
      # Tooling comes from main; the deployed source from the chosen commit, so
      # a rollback target never supplies its own deployer or verifier.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit to deploy
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          MAIN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$MAIN_HEAD}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$MAIN_HEAD"; then
            echo "::error::$sha is not a commit on main"
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/target" "$sha"
          mkdir -p "$RUNNER_TEMP/deploy"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Validates the slugs, refuses a config.toml that turns verify_jwt off and
      # records each function's import graph.
      - name: Plan
        id: plan
        env:
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          python3 scripts/operations/deploy_functions.py plan --functions "$FUNCTIONS" \
            --root "$RUNNER_TEMP/target" --output "$RUNNER_TEMP/deploy/plan.json" \
            --github-output "$GITHUB_OUTPUT"

      # An older handler can break current clients (coach-chat below a3a7263b
      # rejects their `preferences` with 400). Ancestry comes from main's
      # full history; the override is an explicit input and is recorded.
      - name: Rollback floor
        env:
          SLUGS: ${{ steps.plan.outputs.slugs }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ALLOW_BELOW_FLOOR: ${{ inputs.allow_below_floor }}
        run: |
          set -euo pipefail
          override=()
          if [ "$ALLOW_BELOW_FLOOR" = "true" ]; then
            override=(--allow-below-floor)
          fi
          python3 scripts/operations/deploy_functions.py guard --slugs "$SLUGS" \
            --target-sha "$TARGET_SHA" --repo . --output "$RUNNER_TEMP/deploy/guard.json" "${override[@]}"

      # The drift job's query against the target's own migrations: a function
      # deployed before its migration answers its RPCs with 5xx.
      - name: Target migrations registered live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 scripts/operations/deploy_functions.py migrations --root "$RUNNER_TEMP/target" \
            --output "$RUNNER_TEMP/deploy/migrations.json"

      - name: Fetch verified Supabase CLI
        run: |
          set -euo pipefail
          if ! printf '%s' "$SUPABASE_CLI_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::SUPABASE_CLI_SHA256 is not pinned (docs/OPERATIONS.md, Edge Function deploys)"
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/supabase.tar.gz"
          echo "$SUPABASE_CLI_SHA256  $RUNNER_TEMP/supabase.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/cli" supabase
          "$RUNNER_TEMP/cli/supabase" --version
          echo "$RUNNER_TEMP/cli" >> "$GITHUB_PATH"

      # Before: versions, and which source is live (finds unrecorded redeploys;
      # CRLF is ignored because earlier deploys came from a Windows checkout).
      - name: Live state before the deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SLUGS: ${{ steps.plan.outputs.slugs }}
        run: |
          set -euo pipefail
          # Without the versions before, a new version cannot be proven: stop here.
          python3 scripts/operations/deploy_functions.py metadata --slugs "$SLUGS" \
            --output "$RUNNER_TEMP/deploy/before.json"
          for slug in ${SLUGS//,/ }; do
            live="$RUNNER_TEMP/live-before/$slug"
            mkdir -p "$live/supabase"
            if supabase --workdir "$live" functions download "$slug" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
              python3 scripts/operations/deploy_functions.py compare --slug "$slug" --live "$live" \
                --root "$RUNNER_TEMP/target" --ignore-crlf --output "$RUNNER_TEMP/deploy/before-$slug.json" || true
            else
              echo "::warning::$slug: live source not downloadable before the deploy"
            fi
          done

      # verify_jwt stays on: the CLI default, never --no-verify-jwt, and the
      # plan refused any config that disables it. Read back after the deploy.
      - name: Deploy
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SLUGS: ${{ steps.plan.outputs.slugs }}
        run: |
          set -euo pipefail
          for slug in ${SLUGS//,/ }; do
            echo "::group::deploy $slug"
            supabase --workdir "$RUNNER_TEMP/target" functions deploy "$slug" \
              --project-ref "$SUPABASE_PROJECT_REF" --use-api
            touch "$RUNNER_TEMP/deploy/deployed-$slug"
            echo "::endgroup::"
          done

      - name: Live state after the deploy
        if: ${{ always() && steps.plan.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SLUGS: ${{ steps.plan.outputs.slugs }}
        run: |
          set -uo pipefail
          python3 scripts/operations/deploy_functions.py metadata --slugs "$SLUGS" \
            --output "$RUNNER_TEMP/deploy/after.json" || true
          for slug in ${SLUGS//,/ }; do
            live="$RUNNER_TEMP/live-after/$slug"
            mkdir -p "$live/supabase"
            if supabase --workdir "$live" functions download "$slug" --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
              # Byte for byte: this deploy came from a Linux checkout.
              python3 scripts/operations/deploy_functions.py compare --slug "$slug" --live "$live" \
                --root "$RUNNER_TEMP/target" --output "$RUNNER_TEMP/deploy/after-$slug.json" || true
            else
              echo "::error::$slug: live source not downloadable after the deploy"
            fi
          done

      # Preflight 204, the gateway's 401 without a token, the handler's own
      # answer with the public anon key. No user token, no paid call.
      - name: Boot probe
        if: ${{ always() && steps.plan.outcome == 'success' }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SLUGS: ${{ steps.plan.outputs.slugs }}
        run: |
          python3 scripts/operations/deploy_functions.py probe --slugs "$SLUGS" \
            --output "$RUNNER_TEMP/deploy/probe.json" || true

      - name: Deploy record
        if: ${{ always() && steps.plan.outcome == 'success' }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SOURCE_SHA: ${{ steps.target.outputs.sha }}
          MAIN_HEAD: ${{ github.sha }}
        run: |
          python3 scripts/operations/deploy_functions.py record --dir "$RUNNER_TEMP/deploy" \
            --deploy-outcome "$DEPLOY_OUTCOME" --source-sha "$SOURCE_SHA" --main-sha "$MAIN_HEAD" \
            --output "$RUNNER_TEMP/deploy-record/deploy-record.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the deploy record
        if: ${{ always() && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-record-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-record/deploy-record.json
          if-no-files-found: error
          retention-days: 90
