name: security

# Statisch + Dependency-Scans. Laeuft bei jedem Push auf main, bei jedem PR
# gegen main und einmal pro Woche (Montag 06:00 UTC) damit neu publizierte
# CVEs nicht unentdeckt liegen bleiben.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Minimal-Default: nur Lesen. Jobs, die mehr brauchen (SARIF-Upload), heben
# das Recht job-lokal an (Least-Privilege, Audit 2026-06-09, I1).
permissions:
  contents: read

jobs:
  flutter-analyze-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: pub get
        run: flutter pub get

      # --fatal-infos/--fatal-warnings: Info-/Warning-Lints failen den Build,
      # damit die heute saubere Analyse nicht still erodiert (Audit 2026-06-09, L4).
      - name: analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Defines sind im CI Dummies — wir wollen nur dass Code kompiliert
      # und Widget-Tests laufen, nicht gegen Supabase netzwerken.
      # --coverage erzeugt coverage/lcov.info fuer den Floor-Check unten.
      - name: test
        run: |
          flutter test --coverage \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

      # Coverage-Floor als Ratschet, nicht als Blocker.
      #
      # Profil der App: ~22k LOC sind UI (lib/src/widgets + screens), die nur
      # punktuell von Widget-Tests beruehrt werden; die ~4,5k LOC Logik/Sync
      # (models + services) sind dagegen dicht unit-getestet. Daraus ergibt sich
      # eine realistische Gesamt-Line-Coverage im Bereich ~30-40 %.
      #
      # Der Floor steht bewusst ein paar Punkte UNTER dieser Schaetzung (30 %),
      # damit er die jetzt aufgebaute Logik-/Sync-Coverage gegen stilles Erodieren
      # absichert, ohne den Build bei harmlosen UI-Aenderungen faelschlich rot zu
      # machen. Steigt die Coverage nachhaltig, kann der Floor spaeter angehoben
      # werden (Ratschet-Prinzip).
      - name: Coverage floor check
        env:
          COVERAGE_FLOOR: '30'
        run: |
          set -euo pipefail
          LCOV=coverage/lcov.info
          if [ ! -f "$LCOV" ]; then
            echo "::error::coverage/lcov.info nicht gefunden — lief 'flutter test --coverage'?"
            exit 1
          fi
          # LCOV: LF = lines found (instrumentiert), LH = lines hit (getroffen).
          # Total-Line-Coverage = sum(LH) / sum(LF) * 100.
          PCT="$(awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit   += $2 }
            END {
              if (found == 0) { print "0.0"; exit }
              printf "%.1f", (hit / found) * 100
            }
          ' "$LCOV")"
          echo "Total line coverage: ${PCT}% (floor: ${COVERAGE_FLOOR}%)"
          # Float-Vergleich portabel via awk (bash kann nur Integer).
          if awk -v p="$PCT" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(p < f) }'; then
            echo "::error::Line-Coverage ${PCT}% liegt unter dem Floor von ${COVERAGE_FLOOR}%. Bitte Logik-/Sync-Tests ergaenzen (Floor ist ein Ratschet, kein Stylegate)."
            exit 1
          fi
          echo "::notice::Coverage-Floor erfuellt: ${PCT}% >= ${COVERAGE_FLOOR}%."

  build-android:
    name: Android Debug-Build (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Temurin 21 explizit pinnen: Gradle 8.14 des Projekts bricht mit dem
      # Java 25, das neuere Runner-Images als Default setzen.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: pub get
        run: flutter pub get

      # Schneller Vorab-Check: Debug baut in Minuten und faengt Manifest-Merge-,
      # Gradle- und Plugin-Brueche ab, bevor der teure Release-Job unten
      # ueberhaupt anlaeuft. Er ersetzt ihn NICHT - Debug fuehrt weder R8 noch
      # den AOT-Dart-Compiler aus (Review 2026-08-08, G6). Der Release-Job
      # `build-android-release` deckt genau das ab.
      # Defines sind dieselben CI-Dummies wie im Test-Job; kein Artefakt-Upload,
      # es geht nur um "baut es?".
      - name: build apk (debug)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

  # --- G6 (Review 2026-08-08): die CI baut jetzt auch das ausgelieferte -------
  # Artefakt. Vorher lief ausschliesslich `flutter build apk --debug`. Debug ist
  # ein anderer Build-Typ (kein R8, kein isShrinkResources, keine
  # proguard-rules.pro) und ein anderer Dart-Kompilationsmodus (JIT statt AOT
  # mit Tree-Shaking). Die 51 handgepflegten Keep-Rules und der gesamte
  # Shrinking-Pfad wurden in der CI nie ausgefuehrt - der erste Durchlauf
  # passierte auf einer Entwicklermaschine waehrend des Releases.
  #
  # SIGNING - und warum die E5-Wache hier NICHT aufgeweicht wird:
  # android/app/build.gradle.kts bricht seit E5 jeden Release-Task ab, wenn
  # android/key.properties fehlt (Regex ^(assemble|bundle|package)[A-Za-z0-9]*
  # Release$ ueber gradle.taskGraph.whenReady). Der Grund ist gut: ohne die
  # Datei faellt buildTypes.release auf den universellen Android-DEBUG-Key
  # zurueck, Play lehnt den Upload ab und ein sideloadetes Build laesst Google
  # Sign-In still fehlschlagen.
  #
  # Der Job umgeht die Wache nicht - er erfuellt ihre Bedingung ehrlich:
  # er erzeugt pro Lauf einen WEGWERF-Keystore mit zufaelligem Passwort in
  # $RUNNER_TEMP (ausserhalb des Workspace, verschwindet mit dem Runner) und
  # schreibt eine key.properties, die darauf zeigt. Damit ist die Invariante,
  # die E5 schuetzt - "kein Release-Artefakt traegt den Debug-Key" - erfuellt
  # und nicht umgangen. Verworfene Alternativen:
  #   - Keystore aus GitHub-Secrets: die Secrets existieren nicht
  #     (/actions/secrets -> total_count 0). Ein Job, der sich hinter
  #     `if: secrets != ''` versteckt, waere derselbe gruene No-Op wie der
  #     Migrations-Drift-Check (G7).
  #   - Nur den R8-Task direkt fahren (`:app:minifyReleaseWithR8` matcht die
  #     E5-Regex nicht): haengt an AGP-internen Tasknamen und liesse Packaging,
  #     Resource-Shrinking und den AAB-Split ungeprueft.
  #
  # Das Artefakt wird bewusst NICHT hochgeladen. Es ist mit einem Wegwerfschluessel
  # signiert und darf nirgendwo landen, wo es jemand fuer auslieferbar haelt.
  build-android-release:
    name: Android Release-Build (AAB + R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Gleiche Begruendung wie im Debug-Job: Gradle 8.14 bricht mit Java 25.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: pub get
        run: flutter pub get

      # Wegwerf-Keystore. Passwort ist pro Lauf zufaellig und wird nirgends
      # ausgegeben; der Keystore liegt in $RUNNER_TEMP, nicht im Workspace, und
      # ueberlebt den Job nicht. Kein Secret - deshalb auch kein ::add-mask::
      # noetig, es gibt nichts Wiederverwendbares zu schuetzen.
      - name: Wegwerf-Keystore fuer den Release-Build erzeugen
        run: |
          set -euo pipefail
          if [ -f android/key.properties ]; then
            echo "::error::android/key.properties liegt im Checkout — die Datei gehoert nicht ins Repo (android/.gitignore)."
            exit 1
          fi
          KS="$RUNNER_TEMP/eatova-ci-throwaway.p12"
          PW="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$KS" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci-throwaway \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Eatova CI Throwaway, OU=CI, O=Eatova, C=DE" >/dev/null
          # storeFile wird in build.gradle.kts ueber file() aufgeloest — mit
          # absolutem Pfad eindeutig (relativ waere es android/app/).
          {
            echo "storePassword=$PW"
            echo "keyPassword=$PW"
            echo "keyAlias=ci-throwaway"
            echo "storeFile=$KS"
          } > android/key.properties
          echo "Wegwerf-Keystore angelegt: $KS"

      # Das ist der Befehl, der auch das Play-Artefakt erzeugt: bundleRelease,
      # buildTypes.release, R8 + Resource-Shrinking, Dart-AOT mit Tree-Shaking.
      # Defines sind dieselben CI-Dummies wie in den anderen Jobs — dart_defines
      # .json ist gitignored (enthaelt echte Keys) und steht der CI nicht zur
      # Verfuegung.
      #
      # Wenn dieser Schritt mit einem OutOfMemoryError des Gradle- oder
      # R8-Prozesses abbricht: android/gradle.properties setzt
      # org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G. Das ist auf einer
      # Entwicklermaschine unproblematisch, auf einem ubuntu-latest-Runner
      # (4 vCPU / 16 GB) zusammen mit dem Kotlin-Daemon aber knapp. Abhilfe dann:
      #   echo "org.gradle.jvmargs=-Xmx5g" >> ~/.gradle/gradle.properties
      # als eigener Schritt davor (Benutzer-Properties schlagen die des Projekts,
      # ohne dass die lokale Konfiguration angefasst werden muss).
      - name: build appbundle (release, R8 + AOT)
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

      # Beleg, dass R8 wirklich gelaufen ist und nicht still uebersprungen wurde
      # (isMinifyEnabled koennte jemand versehentlich rausnehmen — dann faellt
      # der Build nicht, es entstuende nur kein mapping.txt mehr).
      - name: R8-Beleg pruefen
        run: |
          set -euo pipefail
          MAP=build/app/outputs/mapping/release/mapping.txt
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -s "$MAP" ]; then
            echo "::error::$MAP fehlt oder ist leer — R8 ist NICHT gelaufen. Steht isMinifyEnabled in buildTypes.release noch auf true?"
            exit 1
          fi
          if [ ! -s "$AAB" ]; then
            echo "::error::$AAB fehlt — der Release-Bundle-Task hat kein Artefakt erzeugt."
            exit 1
          fi
          {
            echo "### Android Release-Build (G6)"
            echo ""
            echo "| Artefakt | Groesse |"
            echo "| --- | --- |"
            echo "| \`app-release.aab\` | $(du -h "$AAB" | cut -f1) |"
            echo "| \`mapping.txt\` (R8) | $(du -h "$MAP" | cut -f1) |"
            echo ""
            echo "R8 + Resource-Shrinking + Dart-AOT sind durchgelaufen."
            echo "Das Artefakt ist mit einem Wegwerfschluessel signiert und wird bewusst **nicht** hochgeladen."
          } >> "$GITHUB_STEP_SUMMARY"

      # Kein upload-artifact: siehe Job-Kommentar.

  pub-outdated:
    name: Flutter pub outdated (Info)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      # Info-only — failt den Job nicht. So sehen wir veraltete Deps im
      # Action-Log ohne dass jeder Patch-Release den Build rot macht.
      # (--mode=null-safety wurde mit Dart 3 entfernt und liess den Befehl
      # frueher still mit Exit 65 abbrechen — Audit 2026-06-09, L1.)
      - name: pub outdated
        run: flutter pub outdated || true

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Volle History scannen, nicht nur den HEAD-Commit, damit ein
          # versehentlich (auch in einem aelteren Commit) committetes Secret
          # auffaellt. Public Repo -> gitleaks ist kostenlos, kein Lizenz-Key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV-Scanner (Pub + Deno)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Scannt pubspec.lock (Pub-Ecosystem) und deno.lock falls vorhanden.
      # SARIF-Upload landet im Security-Tab des Repos. KEIN continue-on-error
      # mehr am Scanner-Step: ein bekannter CVE in den Deps failt den Build
      # jetzt sichtbar, statt im Log eines gruenen Jobs zu verschwinden
      # (Audit 2026-06-09, M4).
      # v2-Migration: --skip-git wurde in osv-scanner v2 entfernt (Git-Commit-
      # Scanning ist dort kein Default mehr) — Flag ersatzlos gestrichen.
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./
      # SARIF-Upload braucht Code-Scanning auf Repo-Ebene aktiviert
      # (in den GitHub-Security-Settings). Solange das nicht aktiv ist,
      # failt der Upload mit "Resource not accessible by integration".
      # Tolerant halten — die Scan-Resultate stehen weiter im Job-Log, und
      # der Scanner-Step oben faellt bereits bei echten Findings.
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: osv-results.sarif

  deno-edge-functions:
    name: Deno lint + check (Edge Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          # Deno 1.x ist EOL; die Edge-Runtime ist auf Deno 2. Die Functions
          # sind dependency-frei, der Umstieg ist risikoarm (Audit 2026-06-09, L7).
          deno-version: v2.x
      - name: deno lint
        working-directory: supabase/functions
        run: deno lint
      # `deno check` macht statische TypeScript-Pruefung gegen die Imports
      # ohne die Function tatsaechlich zu deployen.
      - name: deno check
        working-directory: supabase/functions
        run: |
          for fn in */index.ts; do
            echo "::group::deno check $fn"
            deno check "$fn" || exit 1
            echo "::endgroup::"
          done
      # Unit-Tests der Edge Functions. Weiterhin ohne externe Dependencies:
      #   coach-chat/prefilter_test.ts   -  9 Tests, Layer-1-Blocklist (rein)
      #   coach-chat/guardrails_test.ts  -  7 Tests, Layer-2-Weichen (rein)
      #   coach-chat/handler_test.ts     - 24 Tests, End-to-End ueber
      #                                    handleRequest, fetch ist gestubbt
      #                                    (inkl. Quota-vor-Classifier,
      #                                    CWE-770-Fix 2026-08-11; +4 aus dem
      #                                    Message-/History-Groessen-Fix,
      #                                    CWE-400 2026-08-11; +3 aus dem
      #                                    Anon-Key-Reject + Auth-Fail-
      #                                    Limiter, CWE-400 2026-08-11; +3 aus
      #                                    den Provider-Deadlines, Finding 6,
      #                                    CWE-400 2026-08-11)
      #   coach-chat/handler_sentinel_test.ts
      #                                  -  7 Tests, Sentinel-Fehlerpfade
      #                                    (Quota-Row, Provider, History,
      #                                    Session-Check, Store, Rate-Limit;
      #                                    Sentinel-Rest 2026-08-08)
      #   _shared/client_ip_test.ts      - 15 Tests, IP-Normalisierung/Subject
      #   analyze-meal/normalize_test.ts - 14 Tests, Normalisierung der
      #                                    Modell-Antwort (Welle 2 +
      #                                    confidence-Sentinel, 2026-08-08;
      #                                    +3 aus der i18n-Runde 2026-08-10)
      #   search-key/wire_response_contract_test.ts
      #                                  -  6 Tests, Antwort-Vertrag gegen den
      #                                    echten Handler (Welle 5 +
      #                                    Rate-Limit-Shape, 2026-08-08)
      #   coach-chat/recipe_test.ts      -  9 Tests, Rezept-Draft-Logik
      #                                    (Parse/Klemmen/Prompts,
      #                                    /recipe-Feature 2026-08-12)
      #   coach-chat/handler_recipe_test.ts
      #                                  -  8 Tests, End-to-End Recipe-Mode
      #                                    (Quota/Refund/Bild-tolerant +
      #                                    recipe-Spalte & Message-Id,
      #                                    Nachtrag 2026-08-13)
      # Summe: 99 Tests. `deno test` ohne Pfadfilter sammelt alle neun
      # Dateien automatisch ein - eine neue *_test.ts-Datei braucht nur diese
      # Aufzaehlung nachgezogen, der Aufruf unten bleibt unveraendert.
      #
      # --allow-env ist noetig (frueher liefen die Tests flaglos): handler.ts
      # liest Modell-/Limit-Secrets bereits beim Modul-Load und handler_test.ts
      # setzt die Request-Secrets per Deno.env.set. Ohne das Flag bricht schon
      # der Import mit PermissionDenied ab. Mehr Permissions braucht es nicht -
      # insbesondere KEIN --allow-net, weil fetch im Test ersetzt wird.
      #
      # Kein expliziter Pfad noetig: `deno test` steigt auch in das
      # Unterstrich-Verzeichnis _shared/ ab (gegen Deno 2.8 verifiziert) - der
      # Unterstrich haelt nur die Supabase-CLI davon ab, _shared als eigene
      # deploybare Function zu behandeln.
      - name: deno test
        working-directory: supabase/functions
        run: deno test --allow-env

  supabase-migration-drift:
    name: Supabase migration drift (Management API)
    runs-on: ubuntu-latest
    # Faellt nur, wenn eine Repo-Migration NICHT in der Live-Migrationshistorie
    # (supabase_migrations.schema_migrations) registriert ist. Nutzt die
    # Management-API (kein DB-Passwort/CLI-Login noetig).
    #
    # --- G7 (Review 2026-08-08): der Check war ein dauerhaft gruener No-Op ----
    # SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF wurden nie gesetzt
    # (/actions/secrets -> total_count 0). Schrittdaten des letzten Laufs:
    # "Check Supabase secrets" success, "Migration drift check" SKIPPED, Job
    # success. Der einzige automatische Abgleich zwischen Repo-Migrationen und
    # Live-DB ist damit noch nie gelaufen — bei voll gruener Pipeline.
    #
    # Ein uebersprungener Schritt, der den Job gruen laesst, ist eine Luege.
    # Ein Job, der bei jedem Fork-PR rot wird, ist die naechste Luege in die
    # andere Richtung. Deshalb wird jetzt unterschieden:
    #
    #   Secrets da              -> Check laeuft (wie bisher)
    #   Secrets fehlen, aber
    #   der Lauf kann sie
    #   strukturell nicht haben -> sauberer Skip + Hinweis, Job bleibt gruen
    #   Secrets fehlen im
    #   Upstream-Repo           -> Job FAELLT, mit den Setz-Befehlen im Summary
    #
    # "kann sie strukturell nicht haben" ist genau dreierlei:
    #   1. PR aus einem Fork  - GitHub liefert Secrets an Fork-PRs grundsaetzlich
    #                           nicht aus.
    #   2. Dependabot         - laeuft gegen einen eigenen Secret-Store; die
    #                           Actions-Secrets sind dort nicht sichtbar.
    #   3. Fremdes Repo       - jemand hat das Projekt geforkt und pusht auf sein
    #                           eigenes main. Kein Supabase-Projekt, kein Fehler.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Verfuegbarkeit der Secrets EINMAL als Output festhalten. Secrets duerfen
      # nicht direkt in `if:`-Job-Conditions stehen, daher der Umweg ueber einen
      # Step-Output.
      - name: Check Supabase secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Die `&&`-Kurzschluesse sind wichtig: bei einem push-Event existiert
          # github.event.pull_request gar nicht, der Vergleich allein wuerde
          # dann faelschlich "Fork" ergeben.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_UPSTREAM: ${{ github.repository == 'mxritzgit/Eatova' }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ "$IS_FORK_PR" = "true" ] || [ "$IS_DEPENDABOT" = "true" ] || [ "$IS_UPSTREAM" != "true" ]; then
            REASON="Fork-PR/Dependabot/fremdes Repo — Secrets sind hier strukturell nicht verfuegbar."
            echo "::notice::Migration-Drift-Check uebersprungen: $REASON"
            {
              echo "### Supabase Migration-Drift: uebersprungen"
              echo ""
              echo "$REASON Das ist **kein** Konfigurationsfehler und faerbt den Lauf bewusst nicht rot."
              echo ""
              echo "Im Upstream-Repo (\`mxritzgit/Eatova\`) faellt dieser Job, solange die Secrets fehlen."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Supabase Migration-Drift: NICHT konfiguriert"
            echo ""
            echo "\`SUPABASE_ACCESS_TOKEN\` und/oder \`SUPABASE_PROJECT_REF\` fehlen im Upstream-Repo."
            echo "Der einzige automatische Abgleich zwischen \`supabase/migrations/\` und der Live-Datenbank"
            echo "laeuft damit nicht. Frueher hat dieser Job das still uebersprungen und war trotzdem gruen."
            echo ""
            echo "Setzen (einmalig, mit der GitHub CLI):"
            echo ""
            echo '```sh'
            echo 'gh secret set SUPABASE_ACCESS_TOKEN --repo mxritzgit/Eatova   # Token aus https://supabase.com/dashboard/account/tokens'
            echo 'gh secret set SUPABASE_PROJECT_REF  --repo mxritzgit/Eatova   # Project-Ref aus der Supabase-Projekt-URL'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF sind im Upstream-Repo nicht gesetzt — der Migration-Drift-Check kann nicht laufen. Details und Setz-Befehle stehen in der Job-Summary."
          exit 1

      # Fragt die registrierte Migrationshistorie der Live-DB ueber die
      # Management-API ab und vergleicht sie gegen die Dateinamen in
      # supabase/migrations/. Eine Repo-Version, die nicht registriert ist ->
      # Drift -> Job failt. Kein `supabase db push --dry-run` mehr: das brauchte
      # ein zusaetzliches SUPABASE_DB_PASSWORD-Secret + DB-Login.
      - name: Migration drift check (Management API)
        if: steps.secrets.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          QUERY="select coalesce(string_agg(version, ',' order by version), '') as v from supabase_migrations.schema_migrations"
          BODY="$(jq -n --arg q "$QUERY" '{query:$q}')"
          # Browser-User-Agent: Supabase haengt vor der Management-API eine
          # Cloudflare-Regel, die Default-curl-UAs mit Fehler 1010 blockt.
          RESP="$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --data-binary "$BODY")"
          REGISTERED="$(echo "$RESP" | jq -r '.[0].v // empty')"
          if [ -z "$REGISTERED" ]; then
            echo "::error::Konnte die Migrationshistorie nicht lesen (leere/fehlerhafte Antwort der Management-API): $RESP"
            exit 1
          fi
          echo "::group::Registrierte Versionen (Live-DB)"
          echo "$REGISTERED" | tr ',' '\n'
          echo "::endgroup::"
          MISSING=""
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | cut -d_ -f1)"
            case ",$REGISTERED," in
              *",$v,"*) ;;
              *) MISSING="$MISSING $v" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            {
              echo "### Supabase Migration-Drift: DRIFT"
              echo ""
              echo "Nicht in \`supabase_migrations.schema_migrations\` registriert:"
              echo ""
              for v in $MISSING; do echo "- \`$v\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Nicht in supabase_migrations.schema_migrations registrierte Repo-Migration(en):$MISSING — Live-DB weicht vom Repo ab. Migration anwenden + Historie nachziehen. Siehe supabase/SCHEMA_STATE_2026-06-07.md."
            exit 1
          fi
          COUNT="$(ls supabase/migrations/*.sql | wc -l)"
          echo "Keine Migration-Drift — alle ${COUNT} Repo-Migrationen sind auf der Live-DB registriert."
          # Auch der Gutfall landet im Summary: nur so ist von aussen sichtbar,
          # dass der Check wirklich gelaufen ist und nicht wieder still schlaeft.
          {
            echo "### Supabase Migration-Drift: OK"
            echo ""
            echo "Alle **${COUNT}** Repo-Migrationen sind auf der Live-DB registriert."
          } >> "$GITHUB_STEP_SUMMARY"
