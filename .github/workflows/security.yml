name: security

# Static + dependency scans. Weekly cron catches newly published CVEs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only default; jobs needing more (SARIF upload) raise it job-locally
# (least privilege, Audit 2026-06-09, I1).
permissions:
  contents: read

jobs:
  flutter-analyze-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: pub get
        run: flutter pub get

      # --fatal-infos/--fatal-warnings keeps the clean analysis from eroding
      # silently (Audit 2026-06-09, L4).
      - name: analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Defines are CI dummies: compile + widget tests, no Supabase traffic.
      # --coverage writes coverage/lcov.info for the floor check below.
      - name: test
        run: |
          flutter test --coverage \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

      # Coverage floor as a ratchet. The old value of 30 came from a time when
      # the UI was only spot-tested; measured on 2026-09-01 the suite sits at
      # 94.8 % (18627/19650 lines, generated l10n excluded). At 30 the gate
      # could not ratchet at all - coverage would have had to collapse by
      # roughly 12800 lines before it complained, so it silently guarded
      # nothing. 88 keeps about seven points of headroom: a large, genuinely
      # untested feature (~1300 uncovered lines) still lands, a quiet erosion
      # does not. Raise it when the real number moves, never lower it to make
      # a red run green.
      - name: Coverage floor check
        env:
          COVERAGE_FLOOR: '88'
        run: |
          set -euo pipefail
          LCOV=coverage/lcov.info
          if [ ! -f "$LCOV" ]; then
            echo "::error::coverage/lcov.info nicht gefunden — lief 'flutter test --coverage'?"
            exit 1
          fi
          # Generated l10n code (lib/src/l10n/generated/, ~724 getters x 3
          # files) is excluded before summing: it is not ours to test and would
          # otherwise dilute the ratio by several points and mask the ratchet
          # (Review 2026-08-27, F10-07). The floor value stays where it was.
          # LCOV: LF = lines found, LH = lines hit; coverage = sum(LH)/sum(LF).
          PCT="$(awk -F: '
            /^SF:/ { skip = ($2 ~ /lib\/src\/l10n\/generated\//) }
            /^LF:/ { if (!skip) found += $2 }
            /^LH:/ { if (!skip) hit   += $2 }
            END {
              if (found == 0) { print "0.0"; exit }
              printf "%.1f", (hit / found) * 100
            }
          ' "$LCOV")"
          echo "Total line coverage: ${PCT}% (floor: ${COVERAGE_FLOOR}%)"
          # Float compare via awk; bash only does integers.
          if awk -v p="$PCT" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(p < f) }'; then
            echo "::error::Line-Coverage ${PCT}% liegt unter dem Floor von ${COVERAGE_FLOOR}%. Bitte Logik-/Sync-Tests ergaenzen (Floor ist ein Ratschet, kein Stylegate)."
            exit 1
          fi
          echo "::notice::Coverage-Floor erfuellt: ${PCT}% >= ${COVERAGE_FLOOR}%."

  build-android:
    name: Android Debug-Build (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Pin Temurin 21: the project's Gradle 8.14 breaks on the Java 25 that
      # newer runner images default to.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: pub get
        run: flutter pub get

      # Fast pre-check for manifest-merge, Gradle and plugin breakage. Does NOT
      # replace the release job: debug runs neither R8 nor Dart AOT (G6).
      - name: build apk (debug)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

  # --- G6 (Review 2026-08-08): CI builds the shipped artifact ----------------
  # Debug alone never exercised R8, resource shrinking or Dart AOT. The E5
  # guard aborts release tasks without android/key.properties, or the release
  # would fall back to the universal Android DEBUG key; this job satisfies it
  # with a per-run throwaway keystore. The artifact is NOT uploaded.
  build-android-release:
    name: Android Release-Build (AAB + R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Same reason as in the debug job: Gradle 8.14 breaks on Java 25.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: pub get
        run: flutter pub get

      # Throwaway keystore: random password per run, kept in $RUNNER_TEMP and
      # gone with the runner. Not a secret, so no ::add-mask:: needed.
      - name: Wegwerf-Keystore fuer den Release-Build erzeugen
        run: |
          set -euo pipefail
          if [ -f android/key.properties ]; then
            echo "::error::android/key.properties liegt im Checkout — die Datei gehoert nicht ins Repo (android/.gitignore)."
            exit 1
          fi
          KS="$RUNNER_TEMP/eatova-ci-throwaway.p12"
          PW="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$KS" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci-throwaway \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Eatova CI Throwaway, OU=CI, O=Eatova, C=DE" >/dev/null
          # build.gradle.kts resolves storeFile via file(); absolute is
          # unambiguous (relative would mean android/app/).
          {
            echo "storePassword=$PW"
            echo "keyPassword=$PW"
            echo "keyAlias=ci-throwaway"
            echo "storeFile=$KS"
          } > android/key.properties
          echo "Wegwerf-Keystore angelegt: $KS"

      # Same command that produces the Play artifact. On an OutOfMemoryError:
      # the project asks for -Xmx8G, tight on a 4 vCPU runner — prepend a step
      # writing `org.gradle.jvmargs=-Xmx5g` to ~/.gradle/gradle.properties.
      - name: build appbundle (release, R8 + AOT)
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://ci.invalid \
            --dart-define=SUPABASE_ANON_KEY=ci-dummy-key

      # Proof that R8 ran: dropping isMinifyEnabled would not fail the build,
      # it would only stop producing mapping.txt.
      - name: R8-Beleg pruefen
        run: |
          set -euo pipefail
          MAP=build/app/outputs/mapping/release/mapping.txt
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -s "$MAP" ]; then
            echo "::error::$MAP fehlt oder ist leer — R8 ist NICHT gelaufen. Steht isMinifyEnabled in buildTypes.release noch auf true?"
            exit 1
          fi
          if [ ! -s "$AAB" ]; then
            echo "::error::$AAB fehlt — der Release-Bundle-Task hat kein Artefakt erzeugt."
            exit 1
          fi
          {
            echo "### Android Release-Build (G6)"
            echo ""
            echo "| Artefakt | Groesse |"
            echo "| --- | --- |"
            echo "| \`app-release.aab\` | $(du -h "$AAB" | cut -f1) |"
            echo "| \`mapping.txt\` (R8) | $(du -h "$MAP" | cut -f1) |"
            echo ""
            echo "R8 + Resource-Shrinking + Dart-AOT sind durchgelaufen."
            echo "Das Artefakt ist mit einem Wegwerfschluessel signiert und wird bewusst **nicht** hochgeladen."
          } >> "$GITHUB_STEP_SUMMARY"

      # No upload-artifact: see the job comment.

  pub-outdated:
    name: Flutter pub outdated (Info)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      # Info-only: outdated deps show in the log without turning the build red.
      # (--mode=null-safety was removed in Dart 3 and exited 65 — Audit
      # 2026-06-09, L1.)
      - name: pub outdated
        run: flutter pub outdated || true

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Scan the full history, not just HEAD, so a secret committed in an
          # older commit still shows up. Public repo: gitleaks needs no key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV-Scanner (Pub + Deno)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Scans pubspec.lock and deno.lock; SARIF lands in the Security tab.
      # No continue-on-error here: a known CVE fails the build visibly
      # (Audit 2026-06-09, M4). --skip-git was dropped in osv-scanner v2.
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./
      # Needs repo-level code scanning enabled, else "Resource not accessible
      # by integration". Tolerant: the scanner step already fails on findings.
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: osv-results.sarif

  deno-edge-functions:
    name: Deno lint + check (Edge Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          # Deno 1.x is EOL and the edge runtime is on Deno 2; the functions are
          # dependency-free, so the switch is low risk (Audit 2026-06-09, L7).
          deno-version: v2.x
      - name: deno lint
        working-directory: supabase/functions
        run: deno lint
      # `deno check` type-checks against the imports without deploying.
      - name: deno check
        working-directory: supabase/functions
        run: |
          for fn in */index.ts; do
            echo "::group::deno check $fn"
            deno check "$fn" || exit 1
            echo "::endgroup::"
          done
      # Edge Function unit tests, dependency-free and auto-discovered (`deno
      # test` descends into _shared/ too). --allow-env is required because
      # handler.ts reads secrets at module load; NO --allow-net, fetch is
      # stubbed.
      - name: deno test
        working-directory: supabase/functions
        run: deno test --allow-env
      # Befund P5-08b (Review 2026-08-29): the suite runs every test file in
      # ONE isolate, so a file that forgets its own `Deno.env.set` block or
      # leaves a `globalThis.fetch` stub behind can be carried by a sibling and
      # still report green. That is the same class that once left this project
      # with years of green tests over broken mocks. A test that only passes in
      # company is no test, so every file also has to stand alone.
      #
      # P6-05c (Gegenprobe 2026-08-29): the loop itself could report a silent
      # green — the exact failure mode it exists to prevent. A wrong
      # `working-directory`, a rename away from `*_test.ts` (deno also
      # discovers `*.test.ts`) or an edited glob makes `find` come back empty,
      # the loop runs nothing and the step exits 0.
      #
      # The guard is a coverage check against deno's OWN discovery, not a
      # number pasted in here: `--filter` with a pattern no test name carries
      # registers every discovered case and runs none, so its "filtered out"
      # count IS the size of the suite. Adding or deleting tests therefore
      # never needs an edit here (a hardcoded 272 would be stale by the next
      # PR), while a file the loop misses fails loudly.
      - name: deno test (jede Datei einzeln)
        working-directory: supabase/functions
        run: |
          expected=$(deno test --allow-env --filter 'KEIN-TEST-TRAEGT-DIESEN-NAMEN' 2>&1 \
            | sed -n 's/.*| \([0-9][0-9]*\) filtered out.*/\1/p' | tail -1)
          status=0
          files=0
          covered=0
          for f in $(find . \( -name '*_test.ts' -o -name '*.test.ts' \) | sort); do
            echo "::group::deno test $f"
            out=$(deno test --allow-env "$f" 2>&1) || status=1
            echo "$out"
            echo "::endgroup::"
            files=$((files + 1))
            ran=$(printf '%s\n' "$out" | sed -n 's/.*| \([0-9][0-9]*\) passed.*/\1/p' | tail -1)
            skipped=$(printf '%s\n' "$out" | sed -n 's/.*| \([0-9][0-9]*\) ignored.*/\1/p' | tail -1)
            covered=$((covered + ${ran:-0} + ${skipped:-0}))
          done
          echo "Einzellauf: $files Dateien, $covered Faelle; die Suite kennt ${expected:-0}."
          if [ "$files" -eq 0 ] || [ "${expected:-0}" -eq 0 ]; then
            echo "::error::Der Einzellauf hat keine Testdatei gefunden - dieser Schritt haette still gruen gemeldet."
            exit 1
          fi
          [ "$status" -eq 0 ] || exit "$status"
          if [ "$covered" -ne "$expected" ]; then
            echo "::error::Einzellauf deckt $covered von $expected Faellen ab - mindestens eine Datei entgeht der Schleife (Umbenennung? anderes Glob?)."
            exit 1
          fi

  # Befund P7-02 (Review 2026-08-29): none of the nine jobs here could see an
  # RLS regression. No job ever started a Postgres, and the drift job below
  # compares only the version NUMBERS of the migration files against
  # `supabase_migrations.schema_migrations` — registration, not content. So
  # turning `using (user_id = auth.uid())` into `using (true)` left every check
  # green while the table became readable for every logged-in user.
  #
  # Two halves close that, and they are deliberately different in kind:
  #   * test/migrations/rls_invariants_test.dart replays the migrations as TEXT
  #     and asserts the invariants. It rides inside `flutter test`, i.e. inside
  #     the REQUIRED check, and needs no infrastructure.
  #   * this job applies the same migrations to a REAL PostgreSQL and then tries
  #     genuine cross-user access. It is the only place that can prove Postgres
  #     agrees with the text reading — and, as a by-product, that the 35
  #     migrations still replay from scratch, which nothing checked before.
  #
  # NOT one of the required checks: `main` is protected and a new required check
  # has to be entered in the branch-protection settings, which only the repo
  # owner can do. It runs and reports; making it binding is a manual step.
  rls-postgres:
    name: RLS gegen echtes Postgres (Kreuzzugriffe)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned like every action in this workflow (postgres:16).
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rls
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # psql ships with the runner image; the fallback keeps the job from
      # breaking silently should that ever change.
      - name: psql bereitstellen
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # The roles, schema auth and auth.uid()/auth.jwt() that the migrations
      # rest on. Deliberately minimal: what the migrations state must be what
      # protects the rows, so the stand-in must not do the protecting.
      - name: Supabase-Ersatz einspielen
        run: psql -v ON_ERROR_STOP=1 -q -f test/migrations/pg_bootstrap.sql

      # Every migration, in file-name order, exactly as `supabase db reset`
      # would. A migration that no longer replays from scratch fails here.
      - name: Alle Migrationen anwenden
        run: |
          set -euo pipefail
          n=0
          for f in supabase/migrations/*.sql; do
            echo "::group::$(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
            n=$((n + 1))
          done
          echo "MIGRATIONEN=$n" >> "$GITHUB_ENV"
          echo "$n Migrationen angewendet."

      # Two users, rows for each, then real cross-user access as
      # `authenticated` with the other user's JWT and as `anon`.
      - name: Kreuzzugriffe pruefen
        run: psql -v ON_ERROR_STOP=1 -f test/migrations/rls_cross_user.sql

      - name: Zusammenfassung
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "### RLS gegen echtes Postgres: OK"
              echo ""
              echo "Alle **${MIGRATIONEN:-?}** Migrationen wurden von Grund auf angewendet."
              echo "Nutzer A kann die Zeilen von Nutzer B weder lesen noch aendern noch loeschen,"
              echo "\`anon\` kommt an keine Tabelle, und die Server-Wahrheits-Tabellen"
              echo "(\`chat_messages\`, \`chat_quota_usage\`, \`lifetime_stats\`) bleiben schreibgeschuetzt."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### RLS gegen echtes Postgres: FEHLGESCHLAGEN"
              echo ""
              echo "Entweder laesst sich \`supabase/migrations/\` nicht mehr von Grund auf anwenden,"
              echo "oder ein Kreuzzugriff ist durchgekommen. Die genaue Erwartung steht als"
              echo "\`RLS-VERLETZUNG: …\` im Log des fehlgeschlagenen Schritts."
              echo ""
              echo "Quellen: \`test/migrations/pg_bootstrap.sql\`, \`test/migrations/rls_cross_user.sql\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  supabase-migration-drift:
    name: Supabase migration drift (Management API)
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.secrets.outputs.available }}
    # Fails only when a repo migration is missing from the live history, via
    # the Management API. G7: secrets present -> run; structurally unavailable
    # (fork PR, Dependabot, foreign fork) -> skip with the reason in the
    # summary; missing upstream -> FAIL with the setup commands.
    #
    # Audit 2026-08-14 (still OPEN): the account-wide PAT runs arbitrary SQL on
    # production and `pull_request` runs the workflow file from the PR head, so
    # the token is only interpolated on push/schedule/workflow_dispatch — which
    # makes tampering a visible diff, not a barrier. The barrier is a repo
    # step: create environment `supabase-drift` (branch policy `main`), move
    # both secrets there, rotate the token, then uncomment `environment:` in
    # `supabase-migration-drift-live`. It belongs on that downstream job
    # because a violated policy FAILS, and this required check must stay green.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Record secret availability once as an output: secrets cannot be used
      # directly in job-level `if:` conditions.
      - name: Check Supabase secrets
        id: secrets
        env:
          # Deliberately empty on pull_request: the token must never reach a run
          # whose workflow file comes from the PR head (Audit 2026-08-14).
          SUPABASE_ACCESS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_PROJECT_REF: ${{ github.event_name != 'pull_request' && secrets.SUPABASE_PROJECT_REF || '' }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_UPSTREAM: ${{ github.repository == 'mxritzgit/Eatova' }}
        run: |
          set -euo pipefail
          # PRs first, regardless of whether secrets arrive: the skip is a
          # decision, not a defect. Fork PRs land here too.
          if [ "$IS_PR" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            REASON="pull_request-Lauf — das Supabase-Management-Token wird hier bewusst nicht ausgegeben."
            echo "::notice::Migration-Drift-Check uebersprungen: $REASON"
            {
              echo "### Supabase Migration-Drift: in PRs bewusst ausgesetzt"
              echo ""
              echo "$REASON"
              echo ""
              echo "Der Abgleich laeuft beim **Push auf \`main\`** — also unmittelbar nach dem Merge dieses PRs —"
              echo "und zusaetzlich woechentlich per \`schedule\`. Faellt er dort, weicht die Live-DB vom Repo ab."
              echo ""
              echo "Grund: \`SUPABASE_ACCESS_TOKEN\` ist ein kontoweiter PAT auf einem Endpunkt, der beliebiges SQL"
              echo "auf der Produktivdatenbank ausfuehrt, und bei \`pull_request\` stammt die Workflow-Datei aus dem"
              echo "PR-Head."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"

          if [ "$IS_DEPENDABOT" = "true" ] || [ "$IS_UPSTREAM" != "true" ]; then
            REASON="Dependabot/fremdes Repo — Secrets sind hier strukturell nicht verfuegbar."
            echo "::notice::Migration-Drift-Check uebersprungen: $REASON"
            {
              echo "### Supabase Migration-Drift: uebersprungen"
              echo ""
              echo "$REASON Das ist **kein** Konfigurationsfehler und faerbt den Lauf bewusst nicht rot."
              echo ""
              echo "Im Upstream-Repo (\`mxritzgit/Eatova\`) faellt dieser Job, solange die Secrets fehlen."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Supabase Migration-Drift: NICHT konfiguriert"
            echo ""
            echo "\`SUPABASE_ACCESS_TOKEN\` und/oder \`SUPABASE_PROJECT_REF\` fehlen im Upstream-Repo."
            echo "Der einzige automatische Abgleich zwischen \`supabase/migrations/\` und der Live-Datenbank"
            echo "laeuft damit nicht. Frueher hat dieser Job das still uebersprungen und war trotzdem gruen."
            echo ""
            echo "Setzen (einmalig, mit der GitHub CLI):"
            echo ""
            echo '```sh'
            echo 'gh secret set SUPABASE_ACCESS_TOKEN --repo mxritzgit/Eatova   # Token aus https://supabase.com/dashboard/account/tokens'
            echo 'gh secret set SUPABASE_PROJECT_REF  --repo mxritzgit/Eatova   # Project-Ref aus der Supabase-Projekt-URL'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF sind im Upstream-Repo nicht gesetzt — der Migration-Drift-Check kann nicht laufen. Details und Setz-Befehle stehen in der Job-Summary."
          exit 1

  # The only job that touches the management token, split off so the
  # environment barrier hangs on a job that never starts on pull_request.
  # NOT a required check: as one it would block every merge.
  supabase-migration-drift-live:
    name: Supabase migration drift (Live-Abgleich)
    runs-on: ubuntu-latest
    needs: supabase-migration-drift
    # Second guard beside the empty interpolation upstream: this job stays down
    # in PR runs even if someone reworks the output path above.
    if: needs.supabase-migration-drift.outputs.available == 'true' && github.event_name != 'pull_request'
    # environment: supabase-drift
    # ^ Uncomment only once that environment exists with branch policy `main`
    #   and the secrets moved there; earlier GitHub creates it unprotected.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Compares the live migration history against supabase/migrations/. Not
      # `supabase db push --dry-run`: that needs a DB password secret + login.
      - name: Migration drift check (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          QUERY="select coalesce(string_agg(version, ',' order by version), '') as v from supabase_migrations.schema_migrations"
          BODY="$(jq -n --arg q "$QUERY" '{query:$q}')"
          # Browser UA: a Cloudflare rule in front of the Management API blocks
          # default curl UAs with error 1010.
          RESP="$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --data-binary "$BODY")"
          REGISTERED="$(echo "$RESP" | jq -r '.[0].v // empty')"
          if [ -z "$REGISTERED" ]; then
            echo "::error::Konnte die Migrationshistorie nicht lesen (leere/fehlerhafte Antwort der Management-API): $RESP"
            exit 1
          fi
          echo "::group::Registrierte Versionen (Live-DB)"
          echo "$REGISTERED" | tr ',' '\n'
          echo "::endgroup::"
          MISSING=""
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | cut -d_ -f1)"
            case ",$REGISTERED," in
              *",$v,"*) ;;
              *) MISSING="$MISSING $v" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            {
              echo "### Supabase Migration-Drift: DRIFT"
              echo ""
              echo "Nicht in \`supabase_migrations.schema_migrations\` registriert:"
              echo ""
              for v in $MISSING; do echo "- \`$v\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Nicht in supabase_migrations.schema_migrations registrierte Repo-Migration(en):$MISSING — Live-DB weicht vom Repo ab. Migration anwenden + Historie nachziehen. Siehe supabase/SCHEMA_STATE_2026-06-07.md."
            exit 1
          fi
          COUNT="$(ls supabase/migrations/*.sql | wc -l)"
          echo "Keine Migration-Drift — alle ${COUNT} Repo-Migrationen sind auf der Live-DB registriert."
          # The good case goes into the summary too, so it stays visible that
          # the check really ran.
          {
            echo "### Supabase Migration-Drift: OK"
            echo ""
            echo "Alle **${COUNT}** Repo-Migrationen sind auf der Live-DB registriert."
          } >> "$GITHUB_STEP_SUMMARY"
