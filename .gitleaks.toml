# gitleaks config for the security.yml secret scan (Audit 2026-06-09, M2).
# Extends the default rules and allowlists exactly the one credential-shaped
# string that is public by design: the RLS-protected Supabase ANON JWT
# (role=anon). A service_role, OpenRouter or sb_secret_ key still matches.

title = "Eatova gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """Zwei by-design öffentliche Muster: der Supabase-Anon-JWT und \
die eatova.v1.*-Slotnamen der lokalen Speicher."""
regexTarget = "match"
regexes = [
  # JWT header (HS256) + payload prefix: iss=supabase, ref=ftoozz…, role=anon.
  # iat/exp/signature vary, so the tail stays open.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0b296enZtZHVwdHJ2cnJyc2hiIiwicm9sZSI6ImFub24i[A-Za-z0-9_.\-]+''',

  # SharedPreferences/Keychain slot names, e.g. 'eatova.v1.cache_dek'. These
  # are ADDRESSES, not key material, pinned as literals in
  # test/wire_persisted_key_names_test.dart because renaming one cuts existing
  # installs off from their data. generic-api-key fires because the constants
  # end in `Key`; kept narrow to the own namespace so a real key (base64,
  # sb_secret_, sk-or-v1-, a JWT) never matches.
  '''eatova\.v1\.[a-z0-9_.]+''',
]
