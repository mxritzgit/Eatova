name: eatova
description: "Eatova: a polished Flutter nutrition tracking app with AI meal scan and coach."
# Keeps the package from being published to pub.dev by accident.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# <build-name>+<build-number>; both can be overridden via --build-name /
# --build-number. Android: versionName/versionCode, iOS:
# CFBundleShortVersionString/CFBundleVersion.
version: 1.1.0+3

environment:
  sdk: ^3.11.5

# Run `flutter pub outdated` to see newer versions,
# `flutter pub upgrade --major-versions` to take them.
dependencies:
  flutter:
    sdk: flutter
  # Material/widget localizations (GlobalMaterialLocalizations): without the
  # delegates SDK dialogs (showTimePicker, showDatePicker) fall back to English
  # + AM/PM. Wired up in eatova_app.dart.
  flutter_localizations:
    sdk: flutter

  # Already transitive (flutter_localizations pins 0.20.2), but gen_l10n output
  # imports package:intl directly — without this line the build breaks the
  # moment it drops out of the transitive chain.
  intl: ^0.20.2

  # clock pins the wall clock per zone (withClock) for deterministic tests of
  # the time-based slot heuristic. Defaults to DateTime.now().
  clock: ^1.1.1
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  health: ^13.3.1
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.0
  flutter_slidable: ^4.0.3
  # Already transitive via supabase_flutter (gotrue uses it for session
  # persistence). Direct because LocalCache (DATA-3) builds a durable
  # write-through cache on it, so an offline cold start shows the last known
  # state instead of the defaults.
  shared_preferences: ^2.3.0
  # On-device retention layer (PROD-1): locally scheduled nudges. Deliberately
  # no push/APNs/FCM server component — everything runs via zonedSchedule,
  # which keeps the free Apple team status and the zero-cost constraint.
  # timezone provides the TZDateTime base zonedSchedule builds on.
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  # Supplies the IANA name of the device zone so LocalNotificationService.init()
  # sets the tz location correctly; otherwise zonedSchedule falls back to UTC,
  # because DateTime.now().timeZoneName often yields abbreviations (CET/CEST)
  # that tz.getLocation cannot resolve. The lookup is wrapped in try/catch so
  # tests and unsupported platforms still fall back to UTC.
  flutter_timezone: ^5.1.0
  camera: ^0.12.0+2
  # Recompresses in-app camera photos (raw ~1080p/high JPEG quality) to a
  # 1600 px longest edge at JPEG q85 — consistent with the gallery path and
  # safely under the 5 MB cap of the analyze-meal Edge Function. Pure Dart (via
  # compute() in an isolate) instead of flutter_image_compress: no extra native
  # plugin, testable in VM tests, and bakeOrientation bakes in EXIF rotation.
  image: ^4.3.0
  # Native Google login (credential manager sheet on Android, Google SDK dialog
  # on iOS). The sheet shows the consent-screen app name instead of the Supabase
  # domain, which the web OAuth flow is forced to show. The ID token is
  # exchanged via signInWithIdToken.
  google_sign_in: ^7.2.0
  # Crash reporting only (no performance tracing, no replay). The DSN comes
  # solely from --dart-define SENTRY_DSN; without it Sentry is never initialized
  # and main.dart's global error handlers log via dart:developer. Facade:
  # lib/src/services/crash_reporter.dart.
  sentry_flutter: ^9.26.0
  # Already transitive via sentry_flutter — direct because the about dialog
  # reads version + build number from PackageInfo at runtime instead of
  # hardcoding them (hardcoded values drift on every version bump).
  package_info_plus: ^10.2.1
  # SEC-1 cache encryption (see secure_cache_store.dart): keeps ONLY the 32-byte
  # DEK in the OS keystore; the JSON blobs stay in SharedPreferences,
  # AES-256-GCM encrypted with that DEK (envelope encryption).
  # 10.x, not 11.x: the 10 line is the settled one and needs Android minSdk 23,
  # which the project already exceeds at 26.
  flutter_secure_storage: ^10.3.1
  # Already transitive via the Supabase/Sentry chain — direct because
  # secure_cache_store.dart uses GCMBlockCipher(AESEngine()) itself. Pulls in no
  # extra package. Still the MANDATORY fallback: desktop, the VM test env and
  # any device without the plugin channel encrypt the cache with it.
  pointycastle: ^4.0.0
  # PERF-B1: AES-256-GCM in pure Dart is the dominant recurring CPU cost
  # (91.5 ms for 210 meals on desktop JIT, mobile AOT 2-4x slower, every meal
  # mutation re-encrypts the whole blob). `cryptography_flutter` routes the
  # same primitive through javax.crypto / CryptoKit, which use the ARMv8 AES
  # instructions. `cryptography` is its base package and supplies the API
  # (AesGcm/SecretBox) plus its own pure-Dart implementation; our own code uses
  # the two classes directly and never reads Cryptography.instance — see
  # secure_cache_store.dart's cipher selection. The plugin DOES take that global
  # over: cryptography_flutter declares `dartPluginClass: FlutterCryptography`,
  # so Flutter's generated registrant calls registerWith() at startup on
  # Android/iOS/macOS and that sets `Cryptography.instance = defaultInstance`.
  # Inert today — gotrue is the only other package that depends on
  # `cryptography` and it never imports it — but it is a global, so a future
  # dependency that reads the instance gets the platform implementation.
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  # Also already transitive, but `recipe_image_store.dart` uses it directly for
  # the app documents directory holding own-recipe photos. Without this line the
  # build breaks the moment it drops out of the transitive chain;
  # `depend_on_referenced_packages: ignore` hides that until then.
  path_provider: ^2.1.0
  app_settings: ^9.0.0
  http: ^1.6.0
  supabase: ^2.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Both only for the MealCameraSheet camera test: a CameraPlatform fake
  # replaces the real device camera, and MockPlatformInterfaceMixin allows
  # overriding CameraPlatform.instance in the test.
  camera_platform_interface: ^2.13.1
  plugin_platform_interface: ^2.1.8

  # Recommended lint set; activated in `analysis_options.yaml`.
  flutter_lints: ^6.0.0

  # Generates launcher icons (Android incl. adaptive + iOS) from the masters
  # under branding/appicon. Regenerate: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/appicon/icon-1024.png
  adaptive_icon_background: "#0B0D11"
  adaptive_icon_foreground: branding/appicon/icon-foreground.png
  remove_alpha_ios: true

# Generic Dart part of this file: https://dart.dev/tools/pub/pubspec

# Flutter-specific section.
flutter:

  generate: true

  # Bundles the Material Icons font with the app.
  uses-material-design: true

  # Assets bundled with the app.
  assets:
    - assets/recipes/

  # Two bundled families: Bricolage Grotesque for numbers/headings, Archivo for
  # everything else. Bundled on purpose instead of via google_fonts:
  #   * no runtime request to fonts.gstatic.com (the privacy policy names no
  #     Google font fetch, and it must stay true),
  #   * no fallback-font flash on cold start,
  #   * identical offline — the app has an offline cache.
  # Static cuts (no variable fonts) so fontWeight works without fontVariations.
  # Source: Google Fonts, SIL OFL 1.1.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

  # Resolution-specific variants: https://flutter.dev/to/resolution-aware-images
  # Assets from package dependencies: https://flutter.dev/to/asset-from-package

  # Custom fonts go in a fonts section here, each entry with a "family" key and
  # a "fonts" list of assets and descriptors. Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # Fonts from package dependencies: https://flutter.dev/to/font-from-package
