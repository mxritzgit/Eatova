# Analyzer configuration. Findings show up in Dart-enabled IDEs and in
# `flutter analyze`.

# Recommended lint set for Flutter apps, packages and plugins.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclude only what is not ours: generated code and build artifacts.
  # A blanket `"*.dart"` used to sit here; it matches only repo-root files
  # (`*` never matches `/`) and would silently hide future root files.
  exclude:
    - "**/*.g.dart"
    - "build/**"
    # The imported design template lives as a non-Dart file under
    # docs/design/reference/ (DESIGN_REFACTOR.md §1), so no exclude is needed.
  errors:
    # ARCH-2: a global ignore here used to hide freshly created dead code.
    # `warning`, not `error`, so a single orphan does not fail the build.
    unused_element: warning
    unused_field: warning
    # Info-level style lints must not fail `flutter analyze`.
    unnecessary_underscores: ignore
    unnecessary_brace_in_string_interps: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_conditional_assignment: ignore
    use_null_aware_elements: ignore
    # Tests import http/testing.dart and supabase directly, but both come in
    # transitively via supabase_flutter — no dev_dependency entry needed.
    depend_on_referenced_packages: ignore

linter:
  # Enable or disable rules from the included set here; all lints are listed
  # at https://dart.dev/lints. For a single line or file, prefer
  # `// ignore: name_of_lint` / `// ignore_for_file: name_of_lint`.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    # Extra lints beyond flutter_lints, all auto-fixable via `dart fix`:
    # const widgets save rebuilds, final locals document non-mutation.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    # F10-15: a StreamSubscription field that is never cancelled keeps the
    # listener — and the object behind it — alive past dispose. The
    # `onAuthStateChange` listeners are exactly that shape (see the Sentry
    # round of 2026-08-26). The only rule of the F10-15 set the tree already
    # satisfies, so it goes in as a gate rather than as a wish.
    cancel_subscriptions: true
    # Also proposed by F10-15, all measured against the current tree and NOT
    # enabled: each has existing violations that only a lib/ change could
    # clear, and a lint that has to be silenced everywhere protects nothing.
    #   unawaited_futures    24 (13 lib · 11 test)
    #   discarded_futures    89 (82 lib ·  7 test)
    #   close_sinks           6 ( 0 lib ·  6 test)
    #   avoid_slow_async_io  11 (10 lib ·  1 test) — recipe_image_store.dart
    #   prefer_single_quotes 644 (643 lib · 1 test)

# More on this file: https://dart.dev/guides/language/analysis-options
