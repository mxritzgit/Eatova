# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Ausgeschlossen bleibt nur, was uns nicht gehoert: generierter Code
  # (`*.g.dart` wird von build_runner erzeugt, Lints dort waeren nicht
  # fixbar) und die Build-Artefakte unter `build/`.
  #
  # Das fruehere pauschale `"*.dart"` ist raus: es stammt aus der Zeit der
  # Web-Editor-Drafts im Repo-Root, die laengst geloescht sind. Der Glob
  # matcht ausschliesslich Dateien direkt im Repo-Root (`*` matcht kein `/`),
  # haette also jede kuenftige Root-Datei still vor `flutter analyze`
  # versteckt, statt irgendetwas Sinnvolles zu filtern.
  exclude:
    - "**/*.g.dart"
    - "build/**"
  errors:
    # ARCH-2: Der globale unused_element/unused_field-Ignore versteckte frisch
    # entstandenen toten Code (z.B. _addSteps/_resetWater in
    # eatova_home_page.dart). Die Leichen sind entfernt, der frueher als
    # "Halde" deklarierte Rest (Wasser/Koffein/Schlaf-Handler) ist inzwischen
    # via Today-Log-Sheet verdrahtet. Zurueck auf `warning`, damit kuenftiger
    # toter Code wieder im Analyzer auftaucht statt still liegenzubleiben.
    # Bewusst `warning` (nicht `error`), damit ein vereinzelter Orphan
    # `flutter analyze` nicht hart rot macht.
    unused_element: warning
    unused_field: warning
    # `info`-Level Style-Lints sollen `flutter analyze` nicht fail-en.
    unnecessary_underscores: ignore
    unnecessary_brace_in_string_interps: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_conditional_assignment: ignore
    use_null_aware_elements: ignore
    # http/testing.dart (MockClient) und supabase werden in Tests direkt
    # importiert, kommen aber transitiv ueber supabase_flutter — kein eigener
    # dev_dependency-Eintrag noetig, daher den info-Lint hier demoten.
    depend_on_referenced_packages: ignore

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    # Zusätzliche Wert-Lints (über flutter_lints hinaus). Alle per `dart fix`
    # auto-fixbar und compile-geprüft — const-Widgets sparen Rebuilds, final
    # locals dokumentieren Nicht-Mutation.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
